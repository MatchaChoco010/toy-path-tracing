[project]
name = "ocio-config-generator"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "opencolorio>=2.5.2",
]

[dependency-groups]
dev = [
    "ruff>=0.14.7",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
