[package]
name = "convert-bistro"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "convert-bistro"
path = "src/main.rs"

[dependencies]
russimp = { version = "3.2.1", features = ["static-link"] }
ddsfile = "0.5"
image_dds = { version = "0.7", default-features = false, features = ["ddsfile", "image"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tga"] }
serde_json = "1"
glam = "0.29"
