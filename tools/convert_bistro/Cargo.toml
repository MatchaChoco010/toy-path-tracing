# russimp-sys 2.0.2 published on crates.io only ships headers, so its
# `static-link` feature cannot build assimp from the registry copy. The
# upstream build script also fails on Linux x86_64 because cmake installs the
# assimp library into `lib64/` but only `lib/` is added to the rustc search
# path. The ../russimp-sys submodule is checked out to upstream v2.0.2, and
# assets/download.sh applies tools/russimp-sys-lib64.patch before this helper
# is built.
[patch.crates-io]
russimp-sys = { path = "../russimp-sys" }

[package]
name = "convert-bistro"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "convert-bistro"
path = "src/main.rs"

[dependencies]
russimp = { version = "3.2.1", features = ["static-link"] }
ddsfile = "0.5.2"
image_dds = { version = "0.7.2", default-features = false, features = ["ddsfile", "image"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "tga"] }
serde_json = "1.0.149"
glam = "0.32.1"
